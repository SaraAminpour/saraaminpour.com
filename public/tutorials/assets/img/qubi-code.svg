<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
<style>
.bob{animation:bob 3.6s ease-in-out infinite;transform-origin:100px 180px}
.ant{animation:prec 5s ease-in-out infinite;transform-origin:100px 58px}
.eyes{animation:blink 5s infinite;transform-origin:100px 108px}
.wave{animation:wave 1.4s ease-in-out infinite;transform-origin:152px 104px}
.tw{animation:tw 2.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.tw2{animation:tw 2.2s ease-in-out .7s infinite;transform-box:fill-box;transform-origin:center}
.tw3{animation:tw 2.2s ease-in-out 1.4s infinite;transform-box:fill-box;transform-origin:center}
.zz{animation:zz 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.zz2{animation:zz 3s ease-in-out 1s infinite;transform-box:fill-box;transform-origin:center}
.glow{animation:glow 2.4s ease-in-out infinite}
.drop{animation:drop 2.6s ease-in infinite}
@keyframes bob{0%,100%{transform:translateY(0) scale(1,1)}50%{transform:translateY(-5px) scale(1.01,.99)}}
@keyframes prec{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(9deg)}}
@keyframes blink{0%,46%,50%,100%{transform:scaleY(1)}48%{transform:scaleY(.08)}}
@keyframes wave{0%,100%{transform:rotate(0)}50%{transform:rotate(-22deg)}}
@keyframes tw{0%,100%{transform:scale(.6) rotate(0);opacity:.55}50%{transform:scale(1.1) rotate(20deg);opacity:1}}
@keyframes zz{0%{transform:translate(0,6px) scale(.7);opacity:0}30%{opacity:1}100%{transform:translate(10px,-14px) scale(1.1);opacity:0}}
@keyframes glow{0%,100%{opacity:.55}50%{opacity:1}}
@keyframes drop{0%{transform:translateY(-4px);opacity:0}25%{opacity:1}100%{transform:translateY(10px);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>

<defs>
<radialGradient id="body" cx="0.38" cy="0.3" r="0.85">
  <stop offset="0" stop-color="#f4efff"/>
  <stop offset="0.5" stop-color="#c7b6ff"/>
  <stop offset="1" stop-color="#9478fb"/>
</radialGradient>
<radialGradient id="tip" cx="0.35" cy="0.3" r="0.8">
  <stop offset="0" stop-color="#ffe3ef"/>
  <stop offset="1" stop-color="#ff6fa3"/>
</radialGradient>
<radialGradient id="bulb" cx="0.4" cy="0.35" r="0.8">
  <stop offset="0" stop-color="#fff8d6"/>
  <stop offset="1" stop-color="#ffcf4a"/>
</radialGradient>
</defs>
